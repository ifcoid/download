name: Notify Telegram on Deployment

on:
  deployment_status:

jobs:
  notify:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'github-pages'
    
    runs-on: ubuntu-latest
    
    steps:
      - name: Send Telegram Message
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown          # ← ini yang penting
          message: |
            ✅ *Deploy Berhasil!*

            Binary backend SLR (nsa) telah ter-deploy ke GitHub Pages.

            📥 *Unduh di:* ${{ github.event.deployment_status.environment_url }}
            📦 *Repository:* ${{ github.repository }}
            🔨 *Commit:* ${{ github.sha }}
